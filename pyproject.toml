[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-3d-trace-anything"
version = "0.0.3"
description = "3D tracer using Segment Anything Model"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Hiroki Kawai", email = "h.kawai888@gmail.com"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: napari",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "magicgui",
    "qtpy",
    "napari",
    "torch",
    "torchvision",
    "segment-anything",
    "tqdm",
    "scikit-image",
]

[project.urls]
"Bug Tracker" = "https://github.com/neurobiology-ut/napari-3d-trace-anything/issues"
"Documentation" = "https://github.com/neurobiology-ut/napari-3d-trace-anything#README.md"
"Source Code" = "https://github.com/neurobiology-ut/napari-3d-trace-anything"
"User Support" = "https://github.com/neurobiology-ut/napari-3d-trace-anything/issues"

[project.optional-dependencies]
testing = [
    "tox",
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "pyqt5",
    "tifffile",
]
dev = [
    "black",
    "ruff",
    "pre-commit",
]

[project.entry-points."napari.manifest"]
napari-3d-trace-anything = "napari_3d_trace_anything:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[dependency-groups]
dev = [
    "PySide6",
    "napari-3d-trace-anything[testing]",
]

[tool.black]
line-length = 79
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.ruff]
line-length = 79
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
]

target-version = "py310"
fix = true

[tool.ruff.lint]
select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long. let black handle this
    "UP006", "UP007", # type annotation. As using magicgui require runtime type annotation then we disable this.
    "SIM117", # flake8-simplify - some of merged with statements are not looking great with black, reanble after drop python 3.9
]
